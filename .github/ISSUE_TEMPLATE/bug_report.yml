name: 🐛 Bug Report
description: Report a broken element, layout issue, or responsive styling bug
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue to improve PlotFolio!
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: What browser and operating system were you using?
      placeholder: e.g. Chrome 129 on Windows 11 / Safari iOS 18
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open index.html
        2. Resize window below 480px
        3. See banner overflow
    validations:
      required: true
