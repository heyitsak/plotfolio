name: 🚀 Feature Request
description: Suggest an enhancement or new visual capability for PlotFolio
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea to make PlotFolio even cleaner and faster? Let us know!
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: What feature would you like to see?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem or Motivation
      description: Why would this feature be useful?
    validations:
      required: false
